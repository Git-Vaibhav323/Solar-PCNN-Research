# Phase 6 — Cross-domain learning for AR-PCNN (architecture frozen; training changes)

paths:
  processed_dir: data/processed
  checkpoint_dir: artifacts/checkpoints
  metrics_dir: artifacts/metrics
  figures_dir: data/figures
  scaler_path: data/processed/scaler.joblib
  ninja_path: data/processed/ninja_2019_prepared.csv
  pretrained_ar_pcnn: artifacts/checkpoints/ar_pcnn_best.pt

features:
  - GHI
  - DNI
  - DHI
  - Temperature
  - Relative Humidity
  - Pressure
  - Surface Albedo
  - Wind Speed
  - Wind Direction
  - Dew Point
  - Precipitable Water
  - Solar Zenith Angle
  - hour_sin
  - hour_cos

target: target_power
physics_col: P_theoretical

pv:
  p_rated_w: 250.0
  capacity_margin: 1.1
  n_panels: 40
  system_capacity_kw: 10.0

model:
  name: ar_pcnn_cross_domain
  input_dim: 14
  hidden_dims: [128, 64, 32]
  dropout: 0.2

loss:
  lambda_capacity: 0.5
  lambda_nonneg: 0.5
  lambda_residual: 0.0001
  # Weight on masked ninja MSE (Strategy A)
  lambda_external: 1.0

train:
  strategy: multitask   # multitask | finetune
  batch_size: 64
  max_epochs: 100
  learning_rate: 0.001
  finetune_lr: 0.0005
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  early_stopping_patience: 15
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 7
  min_lr: 1.0e-6
  num_workers: 0
  seed: 42
  device: auto
  target_unit: W
  warm_start: true
  # Strategy B: freeze encoder (and optionally physics heads)
  freeze_encoder: true
  freeze_physics_heads: true
  checkpoint_name_multitask: ar_pcnn_cd_multitask_best.pt
  checkpoint_name_finetune: ar_pcnn_cd_finetune_best.pt

uncertainty:
  n_mc_samples: 50
  target_picp: 0.95
  z: 1.96
